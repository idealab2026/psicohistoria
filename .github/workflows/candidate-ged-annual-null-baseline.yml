name: UCDP Candidate/GED agreement versus null classifier (retrospective)
on:
  push:
    paths:
      - 'scripts/audit_candidate_ged_annual_null_baseline.py'
      - 'scripts/test_audit_candidate_ged_annual_null_baseline.py'
      - 'docs/candidate-ged-annual-null-baseline.md'
      - 'data/candidate-ged-annual-null-baseline-audit.json'
      - 'data/candidate-ged-2021-22-resolution.json'
      - 'scripts/audit_public.py'
      - '.github/workflows/candidate-ged-annual-null-baseline.yml'
  pull_request:
    paths:
      - 'scripts/audit_candidate_ged_annual_null_baseline.py'
      - 'scripts/test_audit_candidate_ged_annual_null_baseline.py'
      - 'docs/candidate-ged-annual-null-baseline.md'
      - 'data/candidate-ged-annual-null-baseline-audit.json'
      - 'data/candidate-ged-2021-22-resolution.json'
      - 'scripts/audit_public.py'
      - '.github/workflows/candidate-ged-annual-null-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-agreement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test no-event comparator and adversarial confusion matrices
        run: python3 -B -m unittest discover -s scripts -p 'test_audit_candidate_ged_annual_null_baseline.py' -v
      - name: Verify exact replay from frozen UCDP source study
        run: python3 -B scripts/audit_candidate_ged_annual_null_baseline.py --check-report
      - name: Audit institutional privacy allowlist
        run: python3 -B scripts/audit_public.py
