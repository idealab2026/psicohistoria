name: GEO H2 fixed initial state uncertainty shadow
on:
  push:
    paths:
      - 'scripts/experiment_geo_h2_fixed_origin_uncertainty_shadow.py'
      - 'scripts/test_experiment_geo_h2_fixed_origin_uncertainty_shadow.py'
      - 'data/geo-h2-origin-state-10pct-uncertainty-shadow.json'
      - '.github/workflows/geo-h2-origin-uncertainty-shadow.yml'
  pull_request:
    paths:
      - 'scripts/experiment_geo_h2_fixed_origin_uncertainty_shadow.py'
      - 'scripts/test_experiment_geo_h2_fixed_origin_uncertainty_shadow.py'
      - 'data/geo-h2-origin-state-10pct-uncertainty-shadow.json'
      - '.github/workflows/geo-h2-origin-uncertainty-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fixed 10 percent initial-state uncertainty and provenance
        run: python3 -B -m unittest discover -s scripts -p 'test_experiment_geo_h2_fixed_origin_uncertainty_shadow.py' -v
      - name: Replay original four-state historical model and new unscored 2027 shadow
        run: |
          if [ -f data/geo-h2-origin-state-10pct-uncertainty-shadow.json ]; then
            python3 -B scripts/experiment_geo_h2_fixed_origin_uncertainty_shadow.py --check-report
          else
            python3 -B scripts/experiment_geo_h2_fixed_origin_uncertainty_shadow.py --print-report
          fi
      - name: Institutional allowlist and privacy audit
        run: python3 -B scripts/audit_public.py
