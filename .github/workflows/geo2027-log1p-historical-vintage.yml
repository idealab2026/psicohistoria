name: GEO2027 LOG1P historical UCDP vintage Shapley stress audit
on:
  pull_request:
    paths:
      - 'scripts/diagnose_geo2027_log1p_historical_vintage_robustness.py'
      - 'scripts/test_diagnose_geo2027_log1p_historical_vintage_robustness.py'
      - 'data/geo2027-log1p-historical-vintage-robustness.json'
      - '.github/workflows/geo2027-log1p-historical-vintage.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_geo2027_log1p_historical_vintage_robustness.py'
      - 'scripts/test_diagnose_geo2027_log1p_historical_vintage_robustness.py'
      - 'data/geo2027-log1p-historical-vintage-robustness.json'
      - '.github/workflows/geo2027-log1p-historical-vintage.yml'
permissions:
  contents: read
jobs:
  geo2027_log1p_historical_vintage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact 3-factor Shapley, source cutoff and historical ranking with ties
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_diagnose_geo2027_log1p_historical_vintage_robustness.py' -v
      - name: Reconstruct five fixed-origin LOG1P UCDP vintage comparisons from original official sources
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_geo2027_log1p_historical_vintage_robustness.py --check-report
