name: FIN-01B monthly realized volatility
on:
  push:
    paths:
      - 'docs/fin01-volatility-protocol.md'
      - 'data/fin01-volatility.json'
      - 'scripts/experiment_fin01_volatility.py'
      - 'scripts/test_experiment_fin01_volatility.py'
      - '.github/workflows/fin01-volatility.yml'
  pull_request:
    paths:
      - 'docs/fin01-volatility-protocol.md'
      - 'data/fin01-volatility.json'
      - 'scripts/experiment_fin01_volatility.py'
      - 'scripts/test_experiment_fin01_volatility.py'
      - '.github/workflows/fin01-volatility.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B scripts/audit_public.py
      - run: python3 -B -m unittest discover -s scripts -p 'test_experiment_fin01_volatility.py' -v
      - run: python3 -B scripts/experiment_fin01_volatility.py --check
