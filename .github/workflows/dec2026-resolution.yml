name: DEC2026 future official resolution contract
on:
  push:
    paths:
      - 'scripts/resolve_dec2026_pilot.py'
      - 'scripts/test_resolve_dec2026_pilot.py'
      - '.github/workflows/dec2026-resolution.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s scripts -p 'test_resolve_dec2026_pilot.py' -v
      - run: python3 -B scripts/resolve_dec2026_pilot.py
      - run: python3 -B scripts/audit_public.py
