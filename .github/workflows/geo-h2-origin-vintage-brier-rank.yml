name: GEO H2 origin-vintage-only Brier ranking attribution
on:
  push:
    paths:
      - 'scripts/audit_geo_h2_origin_vintage_only_brier_rank.py'
      - 'scripts/test_audit_geo_h2_origin_vintage_only_brier_rank.py'
      - 'data/geo-h2-origin-vintage-only-brier-rank.json'
      - '.github/workflows/geo-h2-origin-vintage-brier-rank.yml'
  pull_request:
    paths:
      - 'scripts/audit_geo_h2_origin_vintage_only_brier_rank.py'
      - 'scripts/test_audit_geo_h2_origin_vintage_only_brier_rank.py'
      - 'data/geo-h2-origin-vintage-only-brier-rank.json'
      - '.github/workflows/geo-h2-origin-vintage-brier-rank.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test one-year rank inversion and negative provenance controls
        run: python3 -B -m unittest discover -s scripts -p 'test_audit_geo_h2_origin_vintage_only_brier_rank.py' -v
      - name: Require exact 23-24 origin vintage comparison with 26.1 outcome held fixed
        run: python3 -B scripts/audit_geo_h2_origin_vintage_only_brier_rank.py --check-report
      - name: Verify public institutional allowlist
        run: python3 -B scripts/audit_public.py
