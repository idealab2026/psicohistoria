name: Auditoria y publicacion institucional
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-institutional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify institutional commit identity
        run: |
          git log --all --format='%H|%an|%ae|%cn|%ce' | while IFS='|' read -r sha author email committer commit_email; do
            # GitHub synthesizes a merge commit for PR checks; audit every real commit, not that generated commit.
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$sha" = "$GITHUB_SHA" ]; then
              continue
            fi
            test "$author" = "Idea Lab"
            case "$email" in *+idealab2026@users.noreply.github.com) ;; *) exit 1 ;; esac
            # GitHub creates the committer identity for website squash merges.
            # Never waive or broaden the strict institutional AUTHOR check.
            if [ "$committer" = "GitHub" ] && [ "$commit_email" = "noreply@github.com" ]; then
              continue
            fi
            test "$committer" = "Idea Lab"
            case "$commit_email" in *+idealab2026@users.noreply.github.com) ;; *) exit 1 ;; esac
          done
      - name: Check publication boundary
        env:
          IDEALAB_PUBLIC_DENY_TERMS_JSON: ${{ secrets.IDEALAB_PUBLIC_DENY_TERMS_JSON }}
          IDEALAB_REQUIRE_PRIVATE_DENY_TERMS: 'true'
        run: python3 scripts/audit_public.py
      - name: Unit tests
        run: |
          node --check src/site.mjs
          node --check src/temporal-validation.mjs
          node --check src/private-workbench.mjs
          node --check src/private-notebook.mjs
          node --check src/country-comparison.mjs
          node --check src/country-comparison-view.mjs
          node --check src/main-country-tree.mjs
          node --check src/project-catalog.mjs
          node --check src/project-portfolio.mjs
          node --test tests/*.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build allowlisted static package
        run: |
          mkdir -p dist/src dist/data
          cp index.html trabajo.html privacidad-icsa.html styles.css logo.svg favicon.svg dist/
          cp src/site.mjs src/visuals.mjs src/neural.mjs src/markov-svg.mjs src/lab-renderers.mjs src/metrics.mjs src/research.mjs src/project-catalog.mjs src/project-portfolio.mjs src/private-workbench.mjs src/private-notebook.mjs src/country-comparison.mjs src/country-comparison-view.mjs src/main-country-tree.mjs dist/src/
          cp data/demo.json data/research.json data/projects.json data/forecast-2027-ucdp261.json data/forecast-2027-manifest.json data/forecast-2027-audit.json data/forecast-2027-historical-backtest.json data/forecast-2027-archival-cross-release.json data/forecast-2027-origin-state-diagnostic.json data/forecast-2027-entry-comparison.json dist/data/
          python3 scripts/build_official_countries.py --output dist/data/countries-ucdp261.json
          test "$(find dist -type f | wc -l)" -eq 31
      - uses: actions/upload-artifact@v4
        with:
          name: audited-site
          path: dist/
          retention-days: 1
  prepare_2027_issue_candidate:
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[ISSUE-2027]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate source-pinned 2027 candidate and print full immutable probabilities
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/forecast_2027_statebased.py --output /tmp/idealab-geo2027.json --print-chunks
          test -s /tmp/idealab-geo2027.json
  onset2_homogeneous_holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently evaluate onset2 23.1 to 25.1 with source-pinned hashes
        run: |
          set -e
          if test -f data/onset2-231-251-homogeneous.json; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/evaluate_homogeneous_onset2.py --check-report data/onset2-231-251-homogeneous.json
          else
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/evaluate_homogeneous_onset2.py
          fi
  new_entry_baseline_diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare frozen two-year model to historical two-year entry prevalence, AP and ROC AUC
        run: |
          set -e
          if test -f data/forecast-2027-entry-comparison.json; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/evaluate_2027_new_entries.py --check-report data/forecast-2027-entry-comparison.json
          else
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/evaluate_2027_new_entries.py
          fi
  origin_state_diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit threshold entry versus persistence using archived official UCDP releases
        run: |
          set -e
          if test -f data/forecast-2027-origin-state-diagnostic.json; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_2027_origin_state.py --check-report data/forecast-2027-origin-state-diagnostic.json
          else
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_2027_origin_state.py
          fi
  archived_country_holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Score genuine 23.1 to 25.1 and 24.1 to 26.1 source-separated 2-year horizons
        run: |
          set -e
          if test -f data/forecast-2027-archival-cross-release.json; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/backtest_archived_country_vintages.py --check-report data/forecast-2027-archival-cross-release.json
          else
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/backtest_archived_country_vintages.py
          fi
  inspect_country_vintages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Discover actual UCDP OrganizedViolenceCY historic editions and hash their bytes
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/probe_ucdp_organized_vintages.py --report /tmp/ucdp-organized-vintage-metadata.json
          test -s /tmp/ucdp-organized-vintage-metadata.json
  historical_statebased_backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Evaluate two-year historical origins using exactly 26.1 official source
        run: |
          set -e
          if test -f data/forecast-2027-historical-backtest.json; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/backtest_statebased_2027_spec.py --check-report data/forecast-2027-historical-backtest.json
          else
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/backtest_statebased_2027_spec.py
          fi
  independent_2027_reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently reconstruct all 196 frozen probabilities from official 26.1
        run: |
          set -e
          if test -f data/forecast-2027-audit.json; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_frozen_2027.py --check-report data/forecast-2027-audit.json
          else
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_frozen_2027.py
          fi
  recency_sensitivity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Evaluate only homogeneous archived country-level onset labels
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/experiment_recency_onset.py --report /tmp/idealab-geo01-recency.json
          test -s /tmp/idealab-geo01-recency.json
  cross_release_holdout:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run independent 19.1/23.1 and 23.1/25.1 cross-release holdouts
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/run_legacy_vintage_holdout.py --report /tmp/idealab-geo01-cross-release.json
          test -s /tmp/idealab-geo01-cross-release.json
  vintage_archive_audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect official UCDP historical Onset archive (non-public metadata)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/inspect_ucdp_archives.py --report /tmp/idealab-ucdp-archive.json
          test -s /tmp/idealab-ucdp-archive.json
  deploy:
    if: github.event_name != 'pull_request'
    needs: [quality, independent_2027_reproducibility, historical_statebased_backtest, archived_country_holdout, origin_state_diagnostic, new_entry_baseline_diagnostic]
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: audited-site
          path: dist/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - uses: actions/deploy-pages@v4
