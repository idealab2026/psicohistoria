          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_diagnose_geo2027_alert_count_dependence.py' -v
      - name: Reconstruct original 15-alert pre-outcome dependence distributions
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_geo2027_alert_count_dependence.py
  geo2027_exact_alert_null:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact hypergeometric and anti-tie-leak tests
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_diagnose_geo2027_exact_alert_null.py' -v
      - name: Reproduce 2024/2025 source-pinned, within-year exact alert null
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_geo2027_exact_alert_null.py --check-report data/geo2027-exact-alert-null-archival.json
  geo2027_transition_alert_ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test ex-ante transition risk sets and tie-safe alert rankings
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_evaluate_geo2027_transition_alerts.py' -v
      - name: Reconstruct original GEO two-year transition scores from SHA-pinned releases
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/evaluate_geo2027_transition_alerts.py --check-report data/geo2027-transition-alert-ranking-archival.json
  geo2027_transition_diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove synthetic transition classification and absence of future leakage
        run: |
