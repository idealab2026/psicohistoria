      - name: Test strict official ZIP provenance, date cutoff and conflict-year parsing
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_diagnose_ucdp_prio_older_vintages.py' -v
      - name: Verify PINNED older ACD edition hashes and all four archival incidence comparisons
        run: |
