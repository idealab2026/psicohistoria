      - name: Test time-frozen persistence candidate with synthetic data
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_experiment_newconf_persistence.py' -v
      - name: Run fixed post-hoc 2023/24 UCDP 23.1 to 25.1 persistence comparison
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/experiment_newconf_persistence.py --check-report data/newconf-persistence-2023-24-ablation.json
  prospective_newconf_2027_resolution_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate future official newconf outcome resolver with adversarial synthetic episode, missingness and timing cases
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_evaluate_2027_newconf_official.py' -v
  prospective_newconf_2027_immutable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove 196 committed NEWCONF 2027 country probability bytes and pre-event issue SHA
        run: |
          set -e
          if test -f data/forecast-2027-newconf-audit.json; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_frozen_newconf_2027.py --check-report data/forecast-2027-newconf-audit.json
          else
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_frozen_newconf_2027.py
          fi
  prospective_newconf_2027_candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recompute proposed newconf 2027 forecast from three SHA-pinned source vintages
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/forecast_2027_newconf.py --output /tmp/newconf2027-source-derived.json
          test -s /tmp/newconf2027-source-derived.json
          if test -f data/forecast-2027-newconf.json; then
            cmp /tmp/newconf2027-source-derived.json data/forecast-2027-newconf.json
          fi
  prospective_newconf_2027_source_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify 26.1 UCDP PRIO intrastate origin-2025 against official 25.1 Multiple Onset cohort
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/probe_newconf_2027_acd261.py
  country_multiple_newconf_experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Evaluate country-level new conflicts under source-pinned multiple-onset variants 23.1 and 25.1
        run: |
