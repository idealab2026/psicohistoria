name: Auditoria y publicacion institucional
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-institutional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify institutional commit identity
        run: |
          git log --all --format='%H|%an|%ae|%cn|%ce' | while IFS='|' read -r sha author email committer commit_email; do
            # GitHub synthesizes a merge commit for PR checks; audit every real commit, not that generated commit.
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$sha" = "$GITHUB_SHA" ]; then
              continue
            fi
            test "$author" = "Idea Lab"
            case "$email" in *+idealab2026@users.noreply.github.com) ;; *) exit 1 ;; esac
            # GitHub creates the committer identity for website squash merges.
            # Never waive or broaden the strict institutional AUTHOR check.
            if [ "$committer" = "GitHub" ] && [ "$commit_email" = "noreply@github.com" ]; then
              continue
            fi
            test "$committer" = "Idea Lab"
            case "$commit_email" in *+idealab2026@users.noreply.github.com) ;; *) exit 1 ;; esac
          done
      - name: Check publication boundary
        env:
          IDEALAB_PUBLIC_DENY_TERMS_JSON: ${{ secrets.IDEALAB_PUBLIC_DENY_TERMS_JSON }}
          IDEALAB_REQUIRE_PRIVATE_DENY_TERMS: 'true'
        run: python3 scripts/audit_public.py
      - name: Unit tests
        run: |
          node --check src/site.mjs
          node --check src/temporal-validation.mjs
          node --check src/private-workbench.mjs
          node --check src/private-notebook.mjs
          node --check src/country-comparison.mjs
          node --check src/country-comparison-view.mjs
          node --check src/main-country-tree.mjs
          node --check src/project-catalog.mjs
          node --check src/project-portfolio.mjs
          node --test tests/*.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build allowlisted static package
        run: |
          mkdir -p dist/src dist/data
          cp index.html trabajo.html privacidad-icsa.html styles.css logo.svg favicon.svg dist/
          cp src/site.mjs src/visuals.mjs src/neural.mjs src/markov-svg.mjs src/lab-renderers.mjs src/metrics.mjs src/research.mjs src/project-catalog.mjs src/project-portfolio.mjs src/private-workbench.mjs src/private-notebook.mjs src/country-comparison.mjs src/country-comparison-view.mjs src/main-country-tree.mjs dist/src/
          cp data/demo.json data/research.json data/projects.json data/forecast-2027-ucdp261.json data/forecast-2027-manifest.json data/forecast-2027-audit.json data/forecast-2027-historical-backtest.json data/forecast-2027-archival-cross-release.json data/forecast-2027-origin-state-diagnostic.json data/forecast-2027-entry-comparison.json data/onset2-231-251-homogeneous.json data/onset2-lagged-origin-ablation.json data/onset2-conflict-incidence-ablation.json data/ucdp-prio-incidence-vintages.json data/onset2-country-riskset-audit.json data/country-multiple-onset-source-audit.json data/country-multiple-newconf-experiment.json data/forecast-2027-newconf.json data/forecast-2027-newconf-manifest.json data/forecast-2027-newconf-audit.json dist/data/
          python3 scripts/build_official_countries.py --output dist/data/countries-ucdp261.json
          test "$(find dist -type f | wc -l)" -eq 41
      - uses: actions/upload-artifact@v4
        with:
          name: audited-site
          path: dist/
          retention-days: 1
  prepare_2027_issue_candidate:
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[ISSUE-2027]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate source-pinned 2027 candidate and print full immutable probabilities
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/forecast_2027_statebased.py --output /tmp/idealab-geo2027.json --print-chunks
          test -s /tmp/idealab-geo2027.json
  prospective_geo2027_alert_resolution_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate future-only official GEO state-transition alert resolution
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_evaluate_geo2027_transition_alerts_official.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/evaluate_geo2027_transition_alerts_official.py
  prospective_geo2027_transition_alert_issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test prospective source SHA and anti-tamper alert issuance contracts
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_prepare_geo2027_transition_alerts.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_audit_issued_geo2027_transition_alerts.py' -v
      - name: Produce exact 2027 alert issue candidate only from immutable source
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/prepare_geo2027_transition_alerts.py --output /tmp/geo2027-alert-issue.json --print-canonical
          test -s /tmp/geo2027-alert-issue.json
          if test -f data/forecast-2027-transition-alerts.json; then
            cmp /tmp/geo2027-alert-issue.json data/forecast-2027-transition-alerts.json
            test -s data/forecast-2027-transition-alerts-manifest.json
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_issued_geo2027_transition_alerts.py --check-report data/forecast-2027-transition-alerts-audit.json
          fi
  ucdp_prio_old_vintages_source_probe:
