name: Auditoria y publicacion institucional
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-institutional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify institutional commit identity
        run: |
          git log --all --format='%H|%an|%ae|%cn|%ce' | while IFS='|' read -r sha author email committer commit_email; do
            # GitHub synthesizes a merge commit for PR checks; audit every real commit, not that generated commit.
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$sha" = "$GITHUB_SHA" ]; then
              continue
            fi
            test "$author" = "Idea Lab"
            case "$email" in *+idealab2026@users.noreply.github.com) ;; *) exit 1 ;; esac
            # GitHub creates the committer identity for website squash merges.
            # Never waive or broaden the strict institutional AUTHOR check.
            if [ "$committer" = "GitHub" ] && [ "$commit_email" = "noreply@github.com" ]; then
              continue
            fi
            test "$committer" = "Idea Lab"
            case "$commit_email" in *+idealab2026@users.noreply.github.com) ;; *) exit 1 ;; esac
          done
      - name: Check publication boundary
        env:
          IDEALAB_PUBLIC_DENY_TERMS_JSON: ${{ secrets.IDEALAB_PUBLIC_DENY_TERMS_JSON }}
          IDEALAB_REQUIRE_PRIVATE_DENY_TERMS: 'true'
        run: python3 scripts/audit_public.py
      - name: Unit tests
        run: |
          node --check src/site.mjs
          node --check src/prospective-2028.mjs
          node --check src/future-evaluation-register.mjs
          node --check src/temporal-validation.mjs
          node --check src/private-workbench.mjs
          node --check src/private-notebook.mjs
          node --check src/country-comparison.mjs
          node --check src/country-comparison-view.mjs
          node --check src/main-country-tree.mjs
          node --check src/project-catalog.mjs
          node --check src/project-portfolio.mjs
          node --test tests/*.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build allowlisted static package
        run: |
          mkdir -p dist/src dist/data
          cp index.html trabajo.html privacidad-icsa.html styles.css logo.svg favicon.svg idea-lab-brand-icon.svg dist/
          cp src/site.mjs src/visuals.mjs src/neural.mjs src/markov-svg.mjs src/lab-renderers.mjs src/metrics.mjs src/research.mjs src/project-catalog.mjs src/project-portfolio.mjs src/prospective-registry.mjs src/prospective-2028.mjs src/future-evaluation-register.mjs src/private-workbench.mjs src/private-notebook.mjs src/country-comparison.mjs src/country-comparison-view.mjs src/main-country-tree.mjs dist/src/
          cp data/demo.json data/research.json data/projects.json data/forecast-2027-ucdp261.json data/forecast-2027-manifest.json data/forecast-2027-audit.json data/forecast-2027-historical-backtest.json data/forecast-2027-archival-cross-release.json data/forecast-2027-origin-state-diagnostic.json data/forecast-2027-entry-comparison.json data/onset2-231-251-homogeneous.json data/onset2-lagged-origin-ablation.json data/onset2-conflict-incidence-ablation.json data/ucdp-prio-incidence-vintages.json data/onset2-country-riskset-audit.json data/country-multiple-onset-source-audit.json data/country-multiple-newconf-experiment.json data/forecast-2027-newconf.json data/forecast-2027-newconf-manifest.json data/forecast-2027-newconf-audit.json data/forecast-2028-geo3.json data/forecast-2028-geo3-manifest.json data/future-evaluation-contracts.json data/prospective-2027-registry.json data/prospective-2027-registry-manifest.json dist/data/
          python3 scripts/build_official_countries.py --output dist/data/countries-ucdp261.json
          test "$(find dist -type f | wc -l)" -eq 50
      - uses: actions/upload-artifact@v4
        with:
          name: audited-site
          path: dist/
          retention-days: 1
  prepare_2027_issue_candidate:
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[ISSUE-2027]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate source-pinned 2027 candidate and print full immutable probabilities
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/forecast_2027_statebased.py --output /tmp/idealab-geo2027.json --print-chunks
          test -s /tmp/idealab-geo2027.json
  prospective_geo2027_alert_resolution_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate future-only official GEO state-transition alert resolution
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_evaluate_geo2027_transition_alerts_official.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/evaluate_geo2027_transition_alerts_official.py
  prospective_geo2027_transition_alert_issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test prospective source SHA and anti-tamper alert issuance contracts
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_prepare_geo2027_transition_alerts.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_audit_issued_geo2027_transition_alerts.py' -v
      - name: Produce exact 2027 alert issue candidate only from immutable source
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/prepare_geo2027_transition_alerts.py --output /tmp/geo2027-alert-issue.json --print-canonical
          test -s /tmp/geo2027-alert-issue.json
          if test -f data/forecast-2027-transition-alerts.json; then
            cmp /tmp/geo2027-alert-issue.json data/forecast-2027-transition-alerts.json
            test -s data/forecast-2027-transition-alerts-manifest.json
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_issued_geo2027_transition_alerts.py --check-report data/forecast-2027-transition-alerts-audit.json
          fi
  prospective2027_public_registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test original issue SHA integrity, 424 country-question pairs and no 2027 outcomes
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_build_2027_prospective_registry.py' -v
      - name: Test 424-row public table search, labels, pagination and unchanged issue identities
        run: |
          set -e
          node --test tests/prospective-registry.test.mjs
      - name: Recompute original 2027 GEO NEWCONF ACD public issuance registry
        run: |
          set -e
          test -s data/prospective-2027-registry.json
          test -s data/prospective-2027-registry-manifest.json
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/build_2027_prospective_registry.py --check-report
  acd2027_future_official_scoring_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test post-2027-only source, missing-country fail-closed Brier and no forecast edits
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_evaluate_acd2027_retention_official.py' -v
      - name: Validate original ACD2027 first issue only, NEVER fetch or score 2027 outcomes now
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/evaluate_acd2027_retention_official.py --audit-issuance
  acd2027_named_32_country_view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test exact GWNO source country-name join and unmodified 32 issued probabilities
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_publish_acd2027_named_country_view.py' -v
      - name: Reconstruct readable source-verified ACD2027 32-country original and secondary views
        run: |
          set -e
          test -s data/forecast-2027-acd-retention-country-view.json
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/publish_acd2027_named_country_view.py --check-report
  prospective_acd2027_retention_issuance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove ACD2027 origin 2025 no future labels and source SHA invariant
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_prepare_acd2027_prospective_retention.py' -v
      - name: Verify official 26.1 ACD source and immutable first-public 2027 country forecasts
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/prepare_acd2027_prospective_retention.py --check-issued
      - name: Test ACD2027 first-public manifest, tamper resistance and future-outcome exclusion
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_audit_issued_acd2027_retention.py' -v
      - name: Reconstruct original 32-country 2027 issue from SHA-pinned official 26.1 ZIP
        run: |
          set -e
          test -s data/forecast-2027-acd-retention-audit.json
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_issued_acd2027_retention.py --check-report
  acd_retention_vintage_yearblock_robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic exact weighted ACD source-revision and leave-one-year robustness contracts
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_diagnose_acd_retention_vintage_yearblock.py' -v
      - name: Recompute primary four-fold source-separated results and secondary later-target revisions
        run: |
          set -e
          if test -f data/ucdp-prio-retention-vintage-yearblock-robustness.json; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_acd_retention_vintage_yearblock.py --check-report
          else
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_acd_retention_vintage_yearblock.py --check-report
          fi
  ucdp_prio_retention_four_vintage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify ACD four-vintage historical-only model fitting and negative-universe guard
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_backtest_ucdp_prio_retention_four_vintages.py' -v
      - name: Verify SHA-pinned 24.1 official target edition and reproduce four ACD historical persistence folds
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/backtest_ucdp_prio_retention_four_vintages.py --check-report data/ucdp-prio-2021-2024-retention-four-vintage.json
  ucdp_prio_old_vintages_source_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test strict official ZIP provenance, date cutoff and conflict-year parsing
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_diagnose_ucdp_prio_older_vintages.py' -v
      - name: Verify PINNED older ACD edition hashes and all four archival incidence comparisons
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_ucdp_prio_older_vintages.py --check-report data/ucdp-prio-2020-2022-vintages-archival.json
  geo2027_postcalibration_count_residuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test fixed old-year two-state calibration residual contracts
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_diagnose_geo2027_postcalibration_count_residuals.py' -v
      - name: Recompute revised vs separately-sourced annual count calibration residuals
        run: |
          set -e
          if test -f data/geo2027-postcalibration-count-residuals-archival.json; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_geo2027_postcalibration_count_residuals.py --check-report data/geo2027-postcalibration-count-residuals-archival.json
          else
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_geo2027_postcalibration_count_residuals.py --check-report data/geo2027-postcalibration-count-residuals-archival.json
          fi
  geo2027_ucdp_vintage_revision_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify synthetic edition drift, untouched historical predictions and missing-label guards
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_diagnose_geo2027_ucdp_vintage_revisions.py' -v
      - name: Recompute UCDP four-edition label-revision profile and 2024 196-country score sensitivity
        run: |
          set -e
          if test -f data/geo2027-ucdp-vintage-revisions-archival.json; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_geo2027_ucdp_vintage_revisions.py --check-report data/geo2027-ucdp-vintage-revisions-archival.json
          else
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_geo2027_ucdp_vintage_revisions.py --check-report data/geo2027-ucdp-vintage-revisions-archival.json
          fi
  geo2027_shadow_break_even_frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact Brier break-even math and 196-country synthetic outcome reconstructions
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_diagnose_geo2027_shadow_break_even.py' -v
      - name: Reproduce 2027 original-vs-shadow Brier exact combinatorial frontiers with no future labels
        run: |
          set -e
          if test -f data/geo2027-shadow-break-even-frontier.json; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_geo2027_shadow_break_even.py --check-report data/geo2027-shadow-break-even-frontier.json
          else
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/diagnose_geo2027_shadow_break_even.py --check-report data/geo2027-shadow-break-even-frontier.json
          fi
  prospective_geo2027_calibrated_shadow_future_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert zero real 2027 outcomes and identical 196-country paired future scoring
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_evaluate_geo2027_calibrated_shadow_official.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/evaluate_geo2027_calibrated_shadow_official.py
  prospective_geo2027_calibrated_shadow_issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify SHA-pinned original and future-only shadow generator against adversarial tests
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_prepare_geo2027_calibrated_shadow.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_audit_issued_geo2027_shadow.py' -v
      - name: Reconstruct exact canonical 196-country shadow from previously issued public probabilities
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/prepare_geo2027_calibrated_shadow.py --output /tmp/geo2027-shadow.json --print-canonical
          test -s /tmp/geo2027-shadow.json
          if test -f data/forecast-2027-geo-shadow.json; then
            cmp /tmp/geo2027-shadow.json data/forecast-2027-geo-shadow.json
            test -s data/forecast-2027-geo-shadow-manifest.json
            if test -f data/forecast-2027-geo-shadow-audit.json; then
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_issued_geo2027_shadow.py --check-report data/forecast-2027-geo-shadow-audit.json
            else
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_issued_geo2027_shadow.py
            fi
          fi
  geo2027_temporal_calibration_ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate disjoint calibration years and source integrity with synthetic outcomes
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_experiment_geo2027_temporal_calibration.py' -v
      - name: Recompute train-only log-odds intercept calibration on SHA-pinned historical UCDP releases
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/experiment_geo2027_temporal_calibration.py --check-report data/geo2027-temporal-calibration-ablation.json
  geo2027_historical_count_dispersion:
