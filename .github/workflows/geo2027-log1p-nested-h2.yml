name: GEO2027 nested log1p H2 historical source audit
on:
  pull_request:
    paths:
      - 'scripts/experiment_geo2027_log1p_nested_h2.py'
      - 'scripts/test_experiment_geo2027_log1p_nested_h2.py'
      - 'data/geo2027-log1p-nested-h2.json'
      - '.github/workflows/geo2027-log1p-nested-h2.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/experiment_geo2027_log1p_nested_h2.py'
      - 'scripts/test_experiment_geo2027_log1p_nested_h2.py'
      - 'data/geo2027-log1p-nested-h2.json'
      - '.github/workflows/geo2027-log1p-nested-h2.yml'
permissions:
  contents: read
jobs:
  geo2027_log1p_nested_h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify rolling-origin cutoff, true nested selection and exact GEO binary comparator
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_experiment_geo2027_log1p_nested_h2.py' -v
      - name: Source-replay continuous log1p intensity and calibrator with fixed target years
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/experiment_geo2027_log1p_nested_h2.py --check-report
