name: GEO H2 historical low best high Brier measurement robustness
on:
  pull_request:
    paths:
      - 'scripts/experiment_geo_h2_fatality_estimate_brier_sensitivity.py'
      - 'scripts/test_experiment_geo_h2_fatality_estimate_brier_sensitivity.py'
      - 'docs/geo-h2-fatality-estimate-brier-sensitivity.md'
      - 'data/geo2027-h2-fatality-estimate-brier-sensitivity.json'
      - '.github/workflows/geo-h2-fatality-brier-sensitivity.yml'
      - 'scripts/audit_public.py'
  push:
    branches: [main]
    paths:
      - 'scripts/experiment_geo_h2_fatality_estimate_brier_sensitivity.py'
      - 'scripts/test_experiment_geo_h2_fatality_estimate_brier_sensitivity.py'
      - 'docs/geo-h2-fatality-estimate-brier-sensitivity.md'
      - 'data/geo2027-h2-fatality-estimate-brier-sensitivity.json'
      - '.github/workflows/geo-h2-fatality-brier-sensitivity.yml'
      - 'scripts/audit_public.py'
permissions:
  contents: read
jobs:
  geo_h2_fatality_brier_robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic test source-released historical forecast, exact Brier algebraic bounds and no post-origin leakage
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_experiment_geo_h2_fatality_estimate_brier_sensitivity.py' -v
      - name: Replay four SHA-pinned official UCDP archives and require frozen Brier references
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/experiment_geo_h2_fatality_estimate_brier_sensitivity.py --check-report
      - name: Audit public repository allowlist
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_public.py
