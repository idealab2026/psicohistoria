name: GEO Burundi 2022 institutional source independence and casualty audit
on:
  push:
    paths:
      - 'scripts/audit_geo_burundi_2022_institutional_dependency.py'
      - 'scripts/test_audit_geo_burundi_2022_institutional_dependency.py'
      - 'data/geo-burundi-2022-institutional-source-independence.json'
      - '.github/workflows/geo-burundi-2022-institutional-independence.yml'
  pull_request:
    paths:
      - 'scripts/audit_geo_burundi_2022_institutional_dependency.py'
      - 'scripts/test_audit_geo_burundi_2022_institutional_dependency.py'
      - 'data/geo-burundi-2022-institutional-source-independence.json'
      - '.github/workflows/geo-burundi-2022-institutional-independence.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests — source dependency, FEWS scope, two date windows and negative control
        run: python3 -B -m unittest discover -s scripts -p 'test_audit_geo_burundi_2022_institutional_dependency.py' -v
      - name: Replay editorial-source annotations from frozen source genealogy
        run: |
          if [ -f data/geo-burundi-2022-institutional-source-independence.json ]; then
            python3 -B scripts/audit_geo_burundi_2022_institutional_dependency.py --check-report
          else
            python3 -B scripts/audit_geo_burundi_2022_institutional_dependency.py --print-report
          fi
      - name: Public institutional release and privacy gate
        run: python3 -B scripts/audit_public.py
