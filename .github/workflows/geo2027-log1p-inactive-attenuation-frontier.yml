name: GEO2027 LOG1P inactive slope attenuation Pareto ablation
on:
  pull_request:
    paths:
      - 'scripts/experiment_geo2027_log1p_inactive_attenuation_frontier.py'
      - 'scripts/test_experiment_geo2027_log1p_inactive_attenuation_frontier.py'
      - 'data/geo2027-log1p-inactive-attenuation-frontier.json'
      - '.github/workflows/geo2027-log1p-inactive-attenuation-frontier.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/experiment_geo2027_log1p_inactive_attenuation_frontier.py'
      - 'scripts/test_experiment_geo2027_log1p_inactive_attenuation_frontier.py'
      - 'data/geo2027-log1p-inactive-attenuation-frontier.json'
      - '.github/workflows/geo2027-log1p-inactive-attenuation-frontier.yml'
permissions:
  contents: read
jobs:
  geo2027_log1p_inactive_frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify fixed alpha coefficients, 2027 frozen issue, source stress and Pareto rules
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_experiment_geo2027_log1p_inactive_attenuation_frontier.py' -v
      - name: Reproduce five log1p inactive-slope variants with four official UCDP source releases
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/experiment_geo2027_log1p_inactive_attenuation_frontier.py --check-report
