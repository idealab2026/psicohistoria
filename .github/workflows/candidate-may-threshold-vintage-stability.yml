name: Candidate May 1 5 10 25 threshold vintage stability
on:
  push:
    paths:
      - 'scripts/audit_candidate_may_threshold_stability.py'
      - 'scripts/test_audit_candidate_may_threshold_stability.py'
      - 'docs/candidate-may-threshold-vintage-stability.md'
      - 'data/candidate-may-threshold-vintage-stability.json'
      - 'scripts/audit_public.py'
      - '.github/workflows/candidate-may-threshold-vintage-stability.yml'
  pull_request:
    paths:
      - 'scripts/audit_candidate_may_threshold_stability.py'
      - 'scripts/test_audit_candidate_may_threshold_stability.py'
      - 'docs/candidate-may-threshold-vintage-stability.md'
      - 'data/candidate-may-threshold-vintage-stability.json'
      - 'scripts/audit_public.py'
      - '.github/workflows/candidate-may-threshold-vintage-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  may_stability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic frozen-outcome and source-hash adversarial tests
        run: python3 -B -m unittest discover -s scripts -p 'test_audit_candidate_may_threshold_stability.py' -v
      - name: Audit nine SHA-pinned official Candidate archives for Q2-Q3 threshold label flips
        run: python3 -B scripts/audit_candidate_may_threshold_stability.py --print-report
      - name: Verify institutional public privacy control
        run: python3 -B scripts/audit_public.py
