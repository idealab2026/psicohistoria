name: Candidate vs first annual GED 2021-2022 source-only and outcome audit
on:
  push:
    paths:
      - 'scripts/audit_candidate_ged_2021_22.py'
      - 'scripts/test_audit_candidate_ged_2021_22.py'
      - 'docs/candidate-ged-2021-22-annual-resolution.md'
      - 'data/candidate-ged-2021-22-resolution.json'
      - 'scripts/audit_public.py'
      - '.github/workflows/candidate-ged-2021-22.yml'
  pull_request:
    paths:
      - 'scripts/audit_candidate_ged_2021_22.py'
      - 'scripts/test_audit_candidate_ged_2021_22.py'
      - 'docs/candidate-ged-2021-22-annual-resolution.md'
      - 'data/candidate-ged-2021-22-resolution.json'
      - 'scripts/audit_public.py'
      - '.github/workflows/candidate-ged-2021-22.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  official_early_ged:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic original-source year, window, ZIP and no-tamper tests
        run: python3 -B -m unittest discover -s scripts -p 'test_audit_candidate_ged_2021_22.py' -v
      - name: Require exact replay of frozen 4-source Candidate/2-ZIP GED early-year annual labels
        run: python3 -B scripts/audit_candidate_ged_2021_22.py --check-report
      - name: Institutional public privacy allowlist
        run: python3 -B scripts/audit_public.py
