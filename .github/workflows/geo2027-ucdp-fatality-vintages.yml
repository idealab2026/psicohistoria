name: GEO2027 four-vintage UCDP low best high threshold audit
on:
  pull_request:
    paths:
      - 'scripts/audit_geo2027_ucdp_fatality_vintages.py'
      - 'scripts/test_audit_geo2027_ucdp_fatality_vintages.py'
      - 'data/geo2027-ucdp-fatality-vintage-intervals.json'
      - 'docs/geo2027-ucdp-fatality-vintages.md'
      - '.github/workflows/geo2027-ucdp-fatality-vintages.yml'
      - 'scripts/audit_public.py'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_geo2027_ucdp_fatality_vintages.py'
      - 'scripts/test_audit_geo2027_ucdp_fatality_vintages.py'
      - 'data/geo2027-ucdp-fatality-vintage-intervals.json'
      - 'docs/geo2027-ucdp-fatality-vintages.md'
      - '.github/workflows/geo2027-ucdp-fatality-vintages.yml'
      - 'scripts/audit_public.py'
permissions:
  contents: read
jobs:
  four_official_ucdp_threshold_revisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test synthetic historical 196-country outcomes and source rejection
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_audit_geo2027_ucdp_fatality_vintages.py' -v
      - name: Reconstruct four SHA-verified official archives and check byte-identical pinned report
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_geo2027_ucdp_fatality_vintages.py --check-report
      - name: Validate public repository privacy boundary
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_public.py
