name: Candidate reactivation 1 5 10 25 death thresholds 2026 holdout
on:
  push:
    paths:
      - 'scripts/experiment_candidate_reactivation_grid.py'
      - 'scripts/test_experiment_candidate_reactivation_grid.py'
      - 'docs/candidate-reactivation-threshold-grid-protocol.md'
      - 'data/candidate-reactivation-threshold-grid.json'
      - 'scripts/audit_public.py'
      - '.github/workflows/candidate-reactivation-threshold-grid.yml'
  pull_request:
    paths:
      - 'scripts/experiment_candidate_reactivation_grid.py'
      - 'scripts/test_experiment_candidate_reactivation_grid.py'
      - 'docs/candidate-reactivation-threshold-grid-protocol.md'
      - 'data/candidate-reactivation-threshold-grid.json'
      - 'scripts/audit_public.py'
      - '.github/workflows/candidate-reactivation-threshold-grid.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  reactivation_grid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run adversarial synthetic risk-set, exact-window and source-pinning tests
        run: python3 -B -m unittest discover -s scripts -p 'test_experiment_candidate_reactivation_grid.py' -v
      - name: Require ten official-source SHA and all frozen 2026 threshold diagnostics to replay exactly
        run: python3 -B scripts/experiment_candidate_reactivation_grid.py --check-report
      - name: Verify institutional public privacy gate
        run: python3 -B scripts/audit_public.py
