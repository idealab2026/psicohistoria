name: GEO GED transition revision impact
on:
  push:
    paths:
      - 'scripts/audit_geo_ged_transition_revision_impact.py'
      - 'scripts/test_audit_geo_ged_transition_revision_impact.py'
      - 'data/geo-ged-transition-revision-impact.json'
      - 'data/geo-ged-20-21-coverage-revisions.json'
      - '.github/workflows/geo-ged-transition-revision-impact.yml'
  pull_request:
    paths:
      - 'scripts/audit_geo_ged_transition_revision_impact.py'
      - 'scripts/test_audit_geo_ged_transition_revision_impact.py'
      - 'data/geo-ged-transition-revision-impact.json'
      - 'data/geo-ged-20-21-coverage-revisions.json'
      - '.github/workflows/geo-ged-transition-revision-impact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify transition revision counts against the pinned source report
        run: python3 scripts/audit_geo_ged_transition_revision_impact.py --check-report
      - name: Test source-revision impact arithmetic and fail-closed controls
        run: python3 -m unittest discover -s scripts -p 'test_audit_geo_ged_transition_revision_impact.py' -v
      - name: Institutional public privacy allowlist
        run: python3 scripts/audit_public.py
