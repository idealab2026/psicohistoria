name: GEO GED25.1 near-25 country-year census
on:
  push:
    paths:
      - 'scripts/audit_geo_ged251_near25_countryyear_census.py'
      - 'scripts/test_audit_geo_ged251_near25_countryyear_census.py'
      - 'data/geo-ged251-near25-2021-22-countryyear-census.json'
      - 'docs/geo-ged251-near25-countryyear-census.md'
      - 'scripts/audit_public.py'
      - '.github/workflows/geo-ged251-near25-census.yml'
  pull_request:
    paths:
      - 'scripts/audit_geo_ged251_near25_countryyear_census.py'
      - 'scripts/test_audit_geo_ged251_near25_countryyear_census.py'
      - 'data/geo-ged251-near25-2021-22-countryyear-census.json'
      - 'docs/geo-ged251-near25-countryyear-census.md'
      - 'scripts/audit_public.py'
      - '.github/workflows/geo-ged251-near25-census.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial tests around 25 threshold and negative controls
        run: python3 -B -m unittest discover -s scripts -p 'test_audit_geo_ged251_near25_countryyear_census.py' -v
      - name: Verify frozen near-25 census against official GED25.1 SHA
        run: python3 -B scripts/audit_geo_ged251_near25_countryyear_census.py --check-report
      - name: Public institutional privacy gate
        run: python3 -B scripts/audit_public.py
