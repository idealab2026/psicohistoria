name: GEO Uganda December 2022 GED25.1 source families
on:
  push:
    paths:
      - 'scripts/audit_geo_uganda2022_december_source_families.py'
      - 'scripts/test_audit_geo_uganda2022_december_source_families.py'
      - 'data/geo-ged251-uganda-2022-december-source-families.json'
      - 'docs/geo-ged251-uganda-december-2022-source-reconciliation.md'
      - 'scripts/audit_public.py'
      - '.github/workflows/geo-uganda2022-december-source-families.yml'
  pull_request:
    paths:
      - 'scripts/audit_geo_uganda2022_december_source_families.py'
      - 'scripts/test_audit_geo_uganda2022_december_source_families.py'
      - 'data/geo-ged251-uganda-2022-december-source-families.json'
      - 'docs/geo-ged251-uganda-december-2022-source-reconciliation.md'
      - 'scripts/audit_public.py'
      - '.github/workflows/geo-uganda2022-december-source-families.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source_families:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Falsification tests for zero-death row and citations
        run: python3 -B -m unittest discover -s scripts -p 'test_audit_geo_uganda2022_december_source_families.py' -v
      - name: Verify SHA-pinned official GED25.1 and emit four-event source metadata
        run: python3 -B scripts/audit_geo_uganda2022_december_source_families.py --emit-report
      - name: Institutional privacy boundary audit
        run: python3 -B scripts/audit_public.py
