name: GEO2027 LOG1P distinct prospective shadow source integrity
on:
  pull_request:
    paths:
      - 'scripts/prepare_geo2027_log1p_shadow.py'
      - 'scripts/test_prepare_geo2027_log1p_shadow.py'
      - 'scripts/audit_geo2027_log1p_shadow_issue.py'
      - 'scripts/test_audit_geo2027_log1p_shadow_issue.py'
      - 'data/forecast-2027-log1p-shadow.json'
      - 'data/forecast-2027-log1p-shadow-manifest.json'
      - '.github/workflows/geo2027-log1p-prospective-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_geo2027_log1p_shadow.py'
      - 'scripts/test_prepare_geo2027_log1p_shadow.py'
      - 'scripts/audit_geo2027_log1p_shadow_issue.py'
      - 'scripts/test_audit_geo2027_log1p_shadow_issue.py'
      - 'data/forecast-2027-log1p-shadow.json'
      - 'data/forecast-2027-log1p-shadow-manifest.json'
      - '.github/workflows/geo2027-log1p-prospective-shadow.yml'
permissions:
  contents: read
jobs:
  geo2027_log1p_prospective_shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify non-reissuance, no future H2 leakage and immutable canonical issue test harness
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_prepare_geo2027_log1p_shadow.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_audit_geo2027_log1p_shadow_issue.py' -v
      - name: Reproduce 196 probabilities with only source-verified UCDP 26.1 and original issued GEO
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/prepare_geo2027_log1p_shadow.py --check-report
      - name: Independently verify first-issued SHA manifest against 196 original country identities
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_geo2027_log1p_shadow_issue.py
