name: UCDP Candidate 30-90 day as-of source gate
on:
  push:
    paths:
      - 'scripts/check_ucdp_candidate_asof.py'
      - 'scripts/test_check_ucdp_candidate_asof.py'
      - 'docs/candidate-30-90-day-asof-protocol.md'
      - 'scripts/audit_public.py'
      - '.github/workflows/candidate-30-90-day-asof.yml'
  pull_request:
    paths:
      - 'scripts/check_ucdp_candidate_asof.py'
      - 'scripts/test_check_ucdp_candidate_asof.py'
      - 'docs/candidate-30-90-day-asof-protocol.md'
      - 'scripts/audit_public.py'
      - '.github/workflows/candidate-30-90-day-asof.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source_vintage_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic adversarial tests (never real results)
        run: python3 -B -m unittest discover -s scripts -p 'test_check_ucdp_candidate_asof.py' -v
      - name: Inspect original UCDP 2026 Candidate quarterly schema (no outcome scoring)
        run: |
          python3 -B - <<'PY'
          import csv, hashlib, io, urllib.request
          url = "https://ucdp.uu.se/downloads/candidateged/GEDEvent_v26_01_26_09.csv"
          request = urllib.request.Request(url, headers={"User-Agent": "IDEA-LAB-science-provenance-check/1.0"})
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = response.read()
          if not payload or len(payload) > 30_000_000:
              raise SystemExit("Official Candidate payload invalid in size")
          header = csv.DictReader(io.StringIO(payload.decode("utf-8-sig"), newline=""))
          required = {"id", "country_id", "type_of_violence", "date_start", "date_end", "best"}
          print("Candidate source =", url)
          print("Source sha256 =", hashlib.sha256(payload).hexdigest())
          print("Source bytes =", len(payload))
          print("Header columns =", header.fieldnames)
          if not header.fieldnames or not required.issubset(header.fieldnames):
              raise SystemExit("REAL SOURCE SCHEMA MISMATCH: don't issue any forecast")
          n = 0
          maxima = ""
          minima = "9999-12-31"
          for row in header:
              n += 1
              d = row["date_end"]
              minima = min(minima, d)
              maxima = max(maxima, d)
          print("Total original candidate rows =", n)
          print("date_end span =", minima, maxima)
          if n == 0 or maxima > "2026-09-30":
              raise SystemExit("REAL SOURCE COVERAGE OUT OF BOUNDS")
          print("AUDIT STATUS: official bytes and schema observed; release date not independently certified; no issued probabilities")
          PY
      - name: Check privacy boundary including all new public scientific files
        run: python3 -B scripts/audit_public.py
