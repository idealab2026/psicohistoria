name: UCDP Candidate 30-90 day as-of source gate
on:
  push:
    paths:
      - 'scripts/check_ucdp_candidate_asof.py'
      - 'scripts/test_check_ucdp_candidate_asof.py'
      - 'docs/candidate-30-90-day-asof-protocol.md'
      - 'data/candidate-2026q3-source-audit.json'
      - 'scripts/audit_public.py'
      - '.github/workflows/candidate-30-90-day-asof.yml'
  pull_request:
    paths:
      - 'scripts/check_ucdp_candidate_asof.py'
      - 'scripts/test_check_ucdp_candidate_asof.py'
      - 'docs/candidate-30-90-day-asof-protocol.md'
      - 'scripts/audit_public.py'
      - '.github/workflows/candidate-30-90-day-asof.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source_vintage_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic adversarial tests (never real results)
        run: python3 -B -m unittest discover -s scripts -p 'test_check_ucdp_candidate_asof.py' -v
      - name: Inspect original UCDP 2026 Candidate quarterly schema (no outcome scoring)
        run: |
          python3 -B - <<'PY'
          import csv, hashlib, io, json, urllib.request
          from datetime import date
          import sys
          sys.path.insert(0, "scripts")
          from check_ucdp_candidate_asof import audit_candidate_rows
          url = "https://ucdp.uu.se/downloads/candidateged/GEDEvent_v26_01_26_09.csv"
          request = urllib.request.Request(url, headers={"User-Agent": "IDEA-LAB-science-provenance-check/1.0"})
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = response.read()
          if not payload or len(payload) > 30_000_000:
              raise SystemExit("Official Candidate payload invalid in size")
          header = csv.DictReader(io.StringIO(payload.decode("utf-8-sig"), newline=""))
          required = {"id", "country_id", "type_of_violence", "date_start", "date_end", "best"}
          print("Candidate source =", url)
          actual_sha = hashlib.sha256(payload).hexdigest()
          print("Source sha256 =", actual_sha)
          pinned_sha = "134da9b3df08b65266802c4b662e572f396c70c92ab62297319be657540bcede"
          if actual_sha != pinned_sha:
              raise SystemExit("Official archived release changed bytes: investigate provenance, DO NOT silently update")
          print("Source bytes =", len(payload))
          print("Header columns =", header.fieldnames)
          if not header.fieldnames or not required.issubset(header.fieldnames):
              raise SystemExit("REAL SOURCE SCHEMA MISMATCH: don't issue any forecast")
          n = 0
          maxima = ""
          minima = "9999-12-31"
          crossing = []
          future_start = []
          for row in header:
              n += 1
              start, end = row["date_start"][:10], row["date_end"][:10]
              minima = min(minima, end)
              maxima = max(maxima, end)
              if end > "2026-09-30":
                  crossing.append((row["id"], start, end))
              if start > "2026-09-30":
                  future_start.append((row["id"], start, end))
          print("Total original candidate rows =", n)
          print("date_end span =", minima, maxima)
          print("Rows ending after September =", len(crossing), crossing[:5])
          print("Rows starting after September =", len(future_start), future_start[:5])
          counts, distinct_countries = audit_candidate_rows(
              payload, date(2026, 1, 1), date(2026, 9, 30)
          )
          print("Validated official archive counts =", counts)
          print("Countries with retained events =", distinct_countries)
          if counts["total"] != 16633 or counts["post_cutoff_quarantined"] != 24:
              raise SystemExit("Previously inspected original Candidate census changed")
          with open("data/candidate-2026q3-source-audit.json", encoding="utf8") as stream:
              frozen = json.load(stream)
          derived = {
              "schema": "idealab.psico.candidate.2026q3.source_audit.v1",
              "status": "ORIGINAL_BYTES_SCHEMA_AUDITED_NO_FORECAST",
              "source_url": url,
              "source_version": "26.01.26.09",
              "source_sha256": actual_sha,
              "source_bytes": len(payload),
              "coverage_start": "2026-01-01",
              "coverage_end": "2026-09-30",
              "event_counts": counts,
              "distinct_countries_with_retained_candidate_events": distinct_countries,
              "latest_available_catalog_month_at_review": "2026-09",
              "reviewed_on": "2026-11-19",
              "days_since_coverage_end_at_review": (date(2026,11,19) - date(2026,9,30)).days,
              "release_date_independently_verified": False,
              "issued_probabilities": 0,
              "certified_future_outcomes": 0,
              "interpretative_warning": (
                  "Candidate events are provisional. Missing country events do not prove zero real violence; "
                  "cross-boundary event fatalities are quarantined."
              ),
          }
          if derived != frozen:
              raise SystemExit("Frozen Candidate report diverges from original-source audit")
          print("Frozen aggregate report exactly matches real official bytes")
          if n == 0:
              raise SystemExit("REAL SOURCE EMPTY")
          print("AUDIT STATUS: official bytes and schema observed; release date not independently certified; no issued probabilities")
          PY
      - name: Check privacy boundary including all new public scientific files
        run: python3 -B scripts/audit_public.py
