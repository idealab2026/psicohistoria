name: GEO2027 LOG1P Markov country history source-ablation
on:
  pull_request:
    paths:
      - 'scripts/experiment_geo2027_log1p_markov_country_history_ablation.py'
      - 'scripts/test_experiment_geo2027_log1p_markov_country_history_ablation.py'
      - 'data/geo2027-log1p-markov-country-history-ablation.json'
      - '.github/workflows/geo2027-log1p-markov-country-history-ablation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/experiment_geo2027_log1p_markov_country_history_ablation.py'
      - 'scripts/test_experiment_geo2027_log1p_markov_country_history_ablation.py'
      - 'data/geo2027-log1p-markov-country-history-ablation.json'
      - '.github/workflows/geo2027-log1p-markov-country-history-ablation.yml'
permissions:
  contents: read
jobs:
  geo2027_log1p_markov_history_ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test exact H2 Markov original and global/local heldout count subtraction with temporal cutoff
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_experiment_geo2027_log1p_markov_country_history_ablation.py' -v
      - name: Reproduce source-pinned 13-block country-global/local Markov counterfactuals on first-issued 2027 safe snapshot
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/experiment_geo2027_log1p_markov_country_history_ablation.py --check-report
