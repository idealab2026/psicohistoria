name: GEO UCDP Uganda 2022 state-based eligibility and source independence
on:
  push:
    paths:
      - 'scripts/audit_geo_uganda2022_statebased_eligibility.py'
      - 'scripts/test_audit_geo_uganda2022_statebased_eligibility.py'
      - 'data/geo-ged251-uganda-2022-eligibility-source-genealogy.json'
      - 'data/geo-ged251-uganda-2022-eligibility-dyad-stress.json'
      - 'docs/geo-ged251-uganda-2022-statebased-eligibility.md'
      - 'scripts/audit_public.py'
      - '.github/workflows/geo-uganda2022-statebased-eligibility.yml'
  pull_request:
    paths:
      - 'scripts/audit_geo_uganda2022_statebased_eligibility.py'
      - 'scripts/test_audit_geo_uganda2022_statebased_eligibility.py'
      - 'data/geo-ged251-uganda-2022-eligibility-source-genealogy.json'
      - 'data/geo-ged251-uganda-2022-eligibility-dyad-stress.json'
      - 'docs/geo-ged251-uganda-2022-statebased-eligibility.md'
      - 'scripts/audit_public.py'
      - '.github/workflows/geo-uganda2022-statebased-eligibility.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-independence and eligibility counterfactual adversarial tests
        run: python3 -B -m unittest discover -s scripts -p 'test_audit_geo_uganda2022_statebased_eligibility.py' -v
      - name: Recompute UCDP GED25.1 official Uganda dyad-year and emit prespecified report
        run: python3 -B scripts/audit_geo_uganda2022_statebased_eligibility.py --emit-report
      - name: Public institutional allowlist gate
        run: python3 -B scripts/audit_public.py
