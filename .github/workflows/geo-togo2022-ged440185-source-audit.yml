name: GEO GED25.1 Togo pivotal 11May2022 original-source audit
on:
  push:
    paths:
      - 'scripts/audit_geo_togo2022_440185_source_genealogy.py'
      - 'scripts/test_audit_geo_togo2022_440185_source_genealogy.py'
      - 'data/geo-ged251-togo2022-440185-public-review.json'
      - 'data/geo-ged251-togo2022-440185-source-genealogy.json'
      - 'docs/geo-ged251-togo2022-pivotal-source-genealogy.md'
      - 'scripts/audit_public.py'
      - '.github/workflows/geo-togo2022-ged440185-source-audit.yml'
  pull_request:
    paths:
      - 'scripts/audit_geo_togo2022_440185_source_genealogy.py'
      - 'scripts/test_audit_geo_togo2022_440185_source_genealogy.py'
      - 'data/geo-ged251-togo2022-440185-public-review.json'
      - 'data/geo-ged251-togo2022-440185-source-genealogy.json'
      - 'docs/geo-ged251-togo2022-pivotal-source-genealogy.md'
      - 'scripts/audit_public.py'
      - '.github/workflows/geo-togo2022-ged440185-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source chronology and casualty independence adversarial controls
        run: python3 -B -m unittest discover -s scripts -p 'test_audit_geo_togo2022_440185_source_genealogy.py' -v
      - name: Require exact frozen Togo 440185 source, low-best and bibliography replay
        run: python3 -B scripts/audit_geo_togo2022_440185_source_genealogy.py --check-report
      - name: Public research privacy gate
        run: python3 -B scripts/audit_public.py
