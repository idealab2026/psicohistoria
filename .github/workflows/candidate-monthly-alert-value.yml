name: Monthly operational alert budget evaluation
on:
  push:
    paths:
      - 'scripts/experiment_candidate_monthly_alert_value.py'
      - 'scripts/test_experiment_candidate_monthly_alert_value.py'
      - 'data/candidate-monthly-alert-value.json'
      - '.github/workflows/candidate-monthly-alert-value.yml'
  pull_request:
    paths:
      - 'scripts/experiment_candidate_monthly_alert_value.py'
      - 'scripts/test_experiment_candidate_monthly_alert_value.py'
      - 'data/candidate-monthly-alert-value.json'
      - '.github/workflows/candidate-monthly-alert-value.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s scripts -p 'test_experiment_candidate_monthly_alert_value.py' -v
      - run: python3 -B scripts/experiment_candidate_monthly_alert_value.py --check
      - run: python3 -B scripts/audit_public.py
