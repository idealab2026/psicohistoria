name: GEO H2 empirical editorial revision rate shadow
on:
  push:
    paths:
      - 'scripts/experiment_geo_h2_empirical_revision_rate_shadow.py'
      - 'scripts/test_experiment_geo_h2_empirical_revision_rate_shadow.py'
      - 'data/geo-h2-empirical-origin-revision-rate-2027-shadow.json'
      - '.github/workflows/geo-h2-empirical-revision-rate-shadow.yml'
  pull_request:
    paths:
      - 'scripts/experiment_geo_h2_empirical_revision_rate_shadow.py'
      - 'scripts/test_experiment_geo_h2_empirical_revision_rate_shadow.py'
      - 'data/geo-h2-empirical-origin-revision-rate-2027-shadow.json'
      - '.github/workflows/geo-h2-empirical-revision-rate-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests for frozen source split, smoothing and eligibility
        run: python3 -B -m unittest discover -s scripts -p 'test_experiment_geo_h2_empirical_revision_rate_shadow.py' -v
      - name: Replay SHA-verified editorial rates, heldout revisions and unscored H2 shadow
        run: |
          if [ -f data/geo-h2-empirical-origin-revision-rate-2027-shadow.json ]; then
            python3 -B scripts/experiment_geo_h2_empirical_revision_rate_shadow.py --check-report
          else
            python3 -B scripts/experiment_geo_h2_empirical_revision_rate_shadow.py --print-report
          fi
      - name: Public institutional privacy release audit
        run: python3 -B scripts/audit_public.py
