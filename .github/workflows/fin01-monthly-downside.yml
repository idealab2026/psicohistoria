name: FIN-01 monthly downside retrospective benchmark
on:
  push:
    paths:
      - 'scripts/experiment_fin01_monthly_downside.py'
      - 'scripts/test_experiment_fin01_monthly_downside.py'
      - 'docs/fin01-monthly-downside-protocol.md'
      - '.github/workflows/fin01-monthly-downside.yml'
      - 'scripts/audit_public.py'
  pull_request:
    paths:
      - 'scripts/experiment_fin01_monthly_downside.py'
      - 'scripts/test_experiment_fin01_monthly_downside.py'
      - 'docs/fin01-monthly-downside-protocol.md'
      - '.github/workflows/fin01-monthly-downside.yml'
      - 'scripts/audit_public.py'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B scripts/audit_public.py
      - run: python3 -B -m unittest discover -s scripts -p 'test_experiment_fin01_monthly_downside.py' -v
      - run: python3 -B scripts/experiment_fin01_monthly_downside.py
