name: GEO H2 196 country zero-low source revision stress
on:
  push:
    paths:
      - 'scripts/experiment_geo_h2_196_zero_low_vintage_sensitivity.py'
      - 'scripts/test_experiment_geo_h2_196_zero_low_vintage_sensitivity.py'
      - 'data/geo-h2-196-zero-low-origin-vintage-sensitivity.json'
      - '.github/workflows/geo-h2-196-zero-low-source-stress.yml'
  pull_request:
    paths:
      - 'scripts/experiment_geo_h2_196_zero_low_vintage_sensitivity.py'
      - 'scripts/test_experiment_geo_h2_196_zero_low_vintage_sensitivity.py'
      - 'data/geo-h2-196-zero-low-origin-vintage-sensitivity.json'
      - '.github/workflows/geo-h2-196-zero-low-source-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify categorical threshold, source-factor and integrity controls
        run: python3 -B -m unittest discover -s scripts -p 'test_experiment_geo_h2_196_zero_low_vintage_sensitivity.py' -v
      - name: Reproduce 196 H2 forecasts across SHA-verified 2x2 source data revisions
        run: |
          if [ -f data/geo-h2-196-zero-low-origin-vintage-sensitivity.json ]; then
            python3 -B scripts/experiment_geo_h2_196_zero_low_vintage_sensitivity.py --check-report
          else
            python3 -B scripts/experiment_geo_h2_196_zero_low_vintage_sensitivity.py --print-report
          fi
      - name: Institutional privacy and public release allowlist
        run: python3 -B scripts/audit_public.py
