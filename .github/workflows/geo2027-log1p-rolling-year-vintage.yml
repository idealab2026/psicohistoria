name: GEO2027 LOG1P rolling chronological H2 year-vintage stability
on:
  pull_request:
    paths:
      - 'scripts/experiment_geo2027_log1p_rolling_year_vintage.py'
      - 'scripts/test_experiment_geo2027_log1p_rolling_year_vintage.py'
      - 'data/geo2027-log1p-rolling-year-vintage-stability.json'
      - '.github/workflows/geo2027-log1p-rolling-year-vintage.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/experiment_geo2027_log1p_rolling_year_vintage.py'
      - 'scripts/test_experiment_geo2027_log1p_rolling_year_vintage.py'
      - 'data/geo2027-log1p-rolling-year-vintage-stability.json'
      - '.github/workflows/geo2027-log1p-rolling-year-vintage.yml'
permissions:
  contents: read
jobs:
  geo2027_log1p_rolling_year_vintage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test t-minus-two label cutoff, no future leakage and repeated archive target years
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_experiment_geo2027_log1p_rolling_year_vintage.py' -v
      - name: Reproduce all chronological annual H2 Brier differences across SHA-pinned official UCDP editions
        run: |
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/experiment_geo2027_log1p_rolling_year_vintage.py --check-report
