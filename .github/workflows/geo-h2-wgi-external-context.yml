name: GEO H2 official World Bank WGI external context
on:
  push:
    paths:
      - 'scripts/experiment_geo_h2_worldbank_wgi_external_context.py'
      - 'scripts/test_experiment_geo_h2_worldbank_wgi_external_context.py'
      - 'data/geo-h2-wgi-political-stability-contextual-concordance.json'
      - '.github/workflows/geo-h2-wgi-external-context.yml'
  pull_request:
    paths:
      - 'scripts/experiment_geo_h2_worldbank_wgi_external_context.py'
      - 'scripts/test_experiment_geo_h2_worldbank_wgi_external_context.py'
      - 'data/geo-h2-wgi-political-stability-contextual-concordance.json'
      - '.github/workflows/geo-h2-wgi-external-context.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict GWNO to ISO3 join, no future-label and rank-metric tests
        run: python3 -B -m unittest discover -s scripts -p 'test_experiment_geo_h2_worldbank_wgi_external_context.py' -v
      - name: SHA-replay official UCDP against World Bank WGI perceptions, no ground-truth claim
        run: |
          if [ -f data/geo-h2-wgi-political-stability-contextual-concordance.json ]; then
            python3 -B scripts/experiment_geo_h2_worldbank_wgi_external_context.py --check-report
          else
            python3 -B scripts/experiment_geo_h2_worldbank_wgi_external_context.py --print-report
          fi
      - name: Institutional privacy and public allowlist gate
        run: python3 -B scripts/audit_public.py
