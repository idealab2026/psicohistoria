name: COUP official source census
on:
  push:
    paths:
      - 'scripts/audit_coup_sources.py'
      - 'scripts/audit_coup_membership.py'
      - 'scripts/audit_coup_reconciliation.py'
      - 'scripts/test_audit_coup_reconciliation.py'
      - 'docs/coup-membership-reconciliation.md'
      - 'scripts/test_audit_coup_membership.py'
      - 'data/coup-source-census.json'
      - 'data/coup-membership-census.json'
      - 'scripts/test_audit_coup_sources.py'
      - '.github/workflows/coup-source-census.yml'
  pull_request:
    paths:
      - 'scripts/audit_coup_sources.py'
      - 'scripts/audit_coup_membership.py'
      - 'scripts/audit_coup_reconciliation.py'
      - 'scripts/test_audit_coup_reconciliation.py'
      - 'docs/coup-membership-reconciliation.md'
      - 'scripts/test_audit_coup_membership.py'
      - 'data/coup-source-census.json'
      - 'data/coup-membership-census.json'
      - 'scripts/test_audit_coup_sources.py'
      - '.github/workflows/coup-source-census.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s scripts -p 'test_audit_coup_sources.py' -v
      - run: python3 -B scripts/audit_public.py
      - run: python3 -B scripts/audit_coup_sources.py --check
      - run: python3 -B -m unittest discover -s scripts -p 'test_audit_coup_membership.py' -v
      - run: python3 -B scripts/audit_coup_membership.py --check
      - run: python3 -B -m unittest discover -s scripts -p 'test_audit_coup_reconciliation.py' -v
      - run: python3 -B scripts/audit_coup_reconciliation.py
